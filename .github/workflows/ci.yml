
name: CI

on: [push, pull_request]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  java:
    runs-on: ubuntu-latest

    env:
      DOCKER_API_VERSION: '1.44'
      JAVA_TOOL_OPTIONS: '-Dapi.version=1.44'

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Docker environment
        run: docker version

      - name: Greenfield verification
        run: mvn -B -f baselines/greenfield-verified/pom.xml clean verify

      - name: Brownfield verification
        run: mvn -B -f runs/0dae8850-00ce-4106-8908-9ddfb7a30741/candidate/pom.xml clean verify

      - name: Ambiguous scenario verification
        run: mvn -B -f runs/94e9c2a1-7ac5-44f9-b1e5-46e10a0debd4/candidate/pom.xml clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
