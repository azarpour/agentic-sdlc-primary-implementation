name: CI
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: mvn -B -f baselines/greenfield-verified/pom.xml verify
      - run: mvn -B -f runs/0dae8850-00ce-4106-8908-9ddfb7a30741/candidate/pom.xml verify
      - run: mvn -B -f runs/94e9c2a1-7ac5-44f9-b1e5-46e10a0debd4/candidate/pom.xml verify
