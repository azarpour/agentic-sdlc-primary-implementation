services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: shortener
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
    healthcheck:
      test: [CMD-SHELL, pg_isready -U demo -d shortener]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
  shortener:
    build: ./baselines/greenfield-verified
    environment:
      DB_URL: jdbc:postgresql://db:5432/shortener
      REDIS_HOST: redis
    depends_on:
      db:
        condition: service_healthy
    ports: ["127.0.0.1:8080:8080"]
  orchestrator:
    build: .
    env_file: .env
    environment:
      VERIFIED_BASELINE: /app/baselines/greenfield-verified
    volumes: ["./runs:/app/runs", "./baselines:/app/baselines:ro"]
    ports: ["127.0.0.1:8000:8000"]
